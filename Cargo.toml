[package]
name = "chatarunga"
version = "2.0.0"
edition = "2021"
authors = ["Deedy Das <deedy@users.noreply.github.com>"]
description = "Chatarunga — a zero-dependency Rust UCI chess engine with SIMD NNUE (~3,480 1CPU / ~3,521 4CPU CCRL)"
license = "MIT"
repository = "https://github.com/deedy/chess-chatarunga"
readme = "README.md"
default-run = "chatarunga"

[lib]
name = "chatarunga"
path = "src/lib.rs"

[[bin]]
name = "chatarunga"
path = "src/main.rs"

[dependencies]
# Zero external dependencies: pure Rust bitboards, alpha-beta search, Lazy SMP, KPK bitbase & SIMD NNUE.

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false

[profile.bench]
inherits = "release"

[profile.test]
opt-level = 3
